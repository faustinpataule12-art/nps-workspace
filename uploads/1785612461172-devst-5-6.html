<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEV Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0A0A0C;
    --surface:#141418;
    --surface-hover:#1B1B20;
    --border:#2A2A30;
    --text:#F2F2F5;
    --text-dim:#8A8A93;
    --neon:#FFFFFF;
    --cyan:#4DFFF3;
    --cyan-dim:var(--cyan-dim);
    --cyan-glow:var(--cyan-glow);
    --cyan-glow-strong:var(--cyan-glow-strong);
    --radius:8px;
    --heading-font:'Chakra Petch', sans-serif;
    --icon-clip:polygon(15% 0, 100% 0, 100% 85%, 85% 100%, 0 100%, 0 15%);
  }
  /* Synthwave — magenta néon, grille à l'horizon, formes anguleuses */
  body.theme-synth{
    --bg:#0B0620;
    --surface:#170B34;
    --surface-hover:#1F1044;
    --border:#3A2065;
    --text:#F5EEFF;
    --text-dim:#B79BDB;
    --neon:#FF3FE0;
    --cyan:#FF3FE0;
    --cyan-dim:rgba(255,63,224,0.15);
    --cyan-glow:rgba(255,63,224,0.35);
    --cyan-glow-strong:rgba(255,63,224,0.55);
    --radius:2px;
    --heading-font:'Orbitron', sans-serif;
    --icon-clip:polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    background-image:
      linear-gradient(rgba(255,63,224,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,63,224,0.06) 1px, transparent 1px);
    background-size:38px 38px;
  }
  /* Matrix — terminal vert, scanlines, angles droits */
  body.theme-matrix{
    --bg:#000000;
    --surface:#020A02;
    --surface-hover:#041604;
    --border:#0F3D0F;
    --text:#4CFF4C;
    --text-dim:#1F8A1F;
    --neon:#00FF41;
    --cyan:#00FF41;
    --cyan-dim:rgba(0,255,65,0.12);
    --cyan-glow:rgba(0,255,65,0.35);
    --cyan-glow-strong:rgba(0,255,65,0.55);
    --radius:0px;
    --heading-font:'JetBrains Mono', monospace;
    --icon-clip:polygon(0 0, 100% 0, 100% 100%, 0 100%);
    font-family:'JetBrains Mono', monospace;
  }
  body.theme-matrix::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:1;
    background:repeating-linear-gradient(180deg, rgba(0,255,65,0.04) 0px, rgba(0,255,65,0.04) 1px, transparent 1px, transparent 3px);
  }
  /* Holo — chrome clair, verre dépoli, formes rondes */
  body.theme-holo{
    --bg:#F0F2F8;
    --surface:#FFFFFF;
    --surface-hover:#E8ECF7;
    --border:#D3D9EC;
    --text:#12131A;
    --text-dim:#5B6178;
    --neon:#000000;
    --cyan:#7A5CFF;
    --cyan-dim:rgba(122,92,255,0.12);
    --cyan-glow:rgba(122,92,255,0.30);
    --cyan-glow-strong:rgba(122,92,255,0.50);
    --radius:16px;
    --heading-font:'Orbitron', sans-serif;
    --icon-clip:circle(50% at 50% 50%);
  }
  body.theme-holo .card, body.theme-holo .browse-card, body.theme-holo .review, body.theme-holo .notif-panel{
    backdrop-filter:blur(6px);
    background:rgba(255,255,255,0.75);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:var(--heading-font);}

  /* Header */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(10,10,12,0.85);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:16px 20px;
  }
  .logo-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .logo{
    font-family:var(--heading-font);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.5px;
    text-shadow:0 0 12px rgba(255,255,255,0.5), 0 0 24px var(--cyan-glow);
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{
    width:8px; height:8px; background:var(--cyan);
    border-radius:1px;
    box-shadow:0 0 8px var(--cyan);
    animation:blink 1.6s infinite;
  }
  @keyframes blink{0%,100%{opacity:1} 50%{opacity:0.2}}

  .bell-wrap{position:relative; cursor:pointer;}
  .bell{
    width:36px; height:36px; border:1px solid var(--border); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-size:16px; color:var(--text-dim);
    transition:border-color .15s, color .15s;
  }
  .bell-wrap:hover .bell{border-color:var(--cyan); color:var(--cyan);}
  .badge{
    position:absolute; top:-4px; right:-4px;
    min-width:16px; height:16px; padding:0 3px;
    background:#FF3B5C; border-radius:var(--radius);
    font-size:10px; font-family:'JetBrains Mono'; font-weight:600;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 8px rgba(255,59,92,0.6);
  }
  .badge.hidden{display:none;}

  .notif-panel{
    display:none;
    position:absolute; right:20px; top:64px; z-index:60;
    width:280px; max-width:calc(100vw - 40px);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    overflow:hidden;
  }
  .notif-panel.open{display:block;}
  .notif-panel .head{
    padding:12px 14px; border-bottom:1px solid var(--border);
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1px; color:var(--text-dim);
  }
  .notif-item{
    padding:12px 14px; border-bottom:1px solid var(--border);
    display:flex; gap:10px; align-items:flex-start;
  }
  .notif-item:last-child{border-bottom:none;}
  .notif-item .dot2{
    width:6px; height:6px; border-radius:50%; background:var(--cyan);
    margin-top:6px; flex:0 0 auto; box-shadow:0 0 6px var(--cyan);
  }
  .notif-item .txt{font-size:13px; line-height:1.4;}
  .notif-item .time{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .notif-close{
    color:var(--text-dim); font-size:14px; cursor:pointer; padding:2px 4px; flex:0 0 auto;
  }
  .notif-close:hover{color:var(--text);}

  .search-wrap{position:relative;}
  .search-wrap::before{
    content:'>';
    position:absolute; left:14px; top:50%; transform:translateY(-50%);
    color:var(--cyan); font-family:'JetBrains Mono'; font-weight:500;
  }
  input#search{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px 12px 32px;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input#search::placeholder{color:var(--text-dim);}
  input#search:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px var(--cyan-dim);
  }

  .categories{
    display:flex; gap:8px; overflow-x:auto;
    padding:14px 20px 0; margin:0 -20px;
    scrollbar-width:none;
  }
  .categories::-webkit-scrollbar{display:none;}
  .sort-tabs{
    display:flex; gap:22px; margin-top:16px;
    border-bottom:1px solid var(--border);
    padding:0 20px; margin:16px -20px 0;
  }
  .sort-tab{
    padding:4px 2px 10px; font-size:14px; color:var(--text-dim);
    cursor:pointer; position:relative; white-space:nowrap;
  }
  .sort-tab.active{color:var(--text); font-weight:600;}
  .sort-tab.active::after{
    content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:var(--cyan); border-radius:2px;
  }
  .cat-chip{
    flex:0 0 auto;
    padding:7px 14px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    font-size:13px;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
  }
  .cat-chip.active, .cat-chip:hover{
    color:var(--bg);
    background:var(--cyan);
    border-color:var(--cyan);
  }

  main{padding:20px; max-width:960px; margin:0 auto;}
  .section-title{
    font-family:var(--heading-font);
    font-weight:600;
    font-size:13px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--text-dim);
    margin:24px 0 12px;
    display:flex; align-items:center; gap:8px;
  }
  .section-title::before{
    content:''; width:3px; height:14px; background:var(--cyan);
    box-shadow:0 0 6px var(--cyan);
  }

  .browse-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;
  }
  .browse-card{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; cursor:pointer; font-size:14px; font-weight:500;
    transition:border-color .15s, box-shadow .15s;
  }
  .browse-card:hover{border-color:var(--cyan); box-shadow:0 0 12px var(--cyan-dim);}
  .browse-card .em{font-size:18px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    cursor:pointer;
    transition:border-color .2s, transform .15s, box-shadow .2s;
  }
  .card:hover{
    border-color:var(--cyan);
    box-shadow:0 0 16px var(--cyan-dim);
    transform:translateY(-2px);
  }
  .icon{
    width:56px; height:56px;
    background:linear-gradient(145deg, #1c1c22, #101013);
    border:1px solid var(--border);
    clip-path:var(--icon-clip);
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    margin-bottom:10px;
  }
  .card h3{font-size:14px; font-weight:600; margin-bottom:4px;}
  .card .cat{font-size:11px; color:var(--text-dim); margin-bottom:8px;}
  .rating{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--cyan);}
  .rating .stars{letter-spacing:1px;}

  /* Detail view */
  .detail{display:none; padding:20px; max-width:720px; margin:0 auto;}
  .detail.open{display:block;}
  main.hidden{display:none;}
  .back-btn{
    background:none; border:1px solid var(--border); color:var(--text-dim);
    padding:8px 12px; border-radius:var(--radius); font-family:'JetBrains Mono'; font-size:12px;
    cursor:pointer; margin-bottom:18px;
  }
  .back-btn:hover{border-color:var(--cyan); color:var(--cyan);}

  .detail-head{display:flex; gap:16px; align-items:flex-start; margin-bottom:16px;}
  .detail-head .icon{width:80px; height:80px; font-size:36px; flex:0 0 auto;}
  .detail-head h2{font-family:var(--heading-font); font-size:22px; margin-bottom:4px;}
  .detail-head .dev{color:var(--text-dim); font-size:13px; margin-bottom:8px;}
  .meta-row{display:flex; gap:16px; flex-wrap:wrap; margin:14px 0; font-size:12px; color:var(--text-dim);}
  .meta-row b{color:var(--text); font-family:'JetBrains Mono'; display:block; font-size:14px;}

  .dl-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--cyan); color:#04191A; font-weight:600;
    border:none; border-radius:var(--radius); padding:12px 22px;
    font-family:var(--heading-font); font-size:14px; cursor:pointer;
    box-shadow:0 0 20px var(--cyan-glow);
    transition:transform .15s, box-shadow .2s;
    margin:16px 0;
  }
  .dl-btn:hover{transform:translateY(-1px); box-shadow:0 0 28px var(--cyan-glow-strong);}

  .desc{color:#C8C8CE; font-size:14px; line-height:1.6; margin:14px 0;}
  .desc.clamped{
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
  }
  .desc-toggle{color:var(--cyan); font-size:13px; font-weight:600; cursor:pointer; margin-top:-6px; margin-bottom:14px; display:inline-block;}
  .shots{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .shots div{
    flex:0 0 auto; width:120px; height:220px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:11px;
  }
  .shots div.has-img{cursor:pointer;}

  /* Visionneuse plein écran (captures d'écran) */
  .lightbox{
    position:fixed; inset:0; z-index:300; background:rgba(5,5,7,0.96);
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%; max-height:85vh; border-radius:8px; object-fit:contain;}
  .lightbox-close{
    position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer;
  }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;
  }
  .lightbox-nav.prev{left:14px;}
  .lightbox-nav.next{right:14px;}

  .review{
    border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;
    background:var(--surface);
  }
  .review .top{display:flex; justify-content:space-between; margin-bottom:6px;}
  .review .name{font-size:13px; font-weight:600;}
  .review .stars{color:var(--cyan); font-size:12px;}
  .review .date{font-size:11px; color:var(--text-dim); margin-bottom:6px;}
  .review p{font-size:13px; color:#C8C8CE; line-height:1.5;}
  .review .helpful{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:12px; color:var(--text-dim);}
  .review .helpful button{
    background:none; border:1px solid var(--border); border-radius:20px; color:var(--text);
    font-size:12px; padding:4px 12px; cursor:pointer;
  }
  .review .helpful button.on{border-color:var(--cyan); color:var(--cyan);}

  .rating-summary{display:flex; gap:20px; align-items:center; margin:14px 0;}
  .rating-summary .big{font-family:var(--heading-font); font-size:40px; font-weight:700; line-height:1;}
  .rating-summary .stars-row{color:var(--cyan); font-size:14px; margin-top:4px;}
  .rating-summary .count{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .rating-bars{flex:1; display:flex; flex-direction:column; gap:4px;}
  .rating-bars .bar-row{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-dim);}
  .rating-bars .bar-track{flex:1; height:6px; background:var(--border); border-radius:4px; overflow:hidden;}
  .rating-bars .bar-fill{height:100%; background:var(--cyan); border-radius:4px;}

  .review-form{
    border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin:16px 0;
    background:var(--surface);
  }
  .review-form textarea, .review-form input{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text); padding:10px; font-family:'Inter'; font-size:13px; margin-bottom:8px; outline:none;
  }
  .review-form textarea:focus, .review-form input:focus{border-color:var(--cyan);}
  .star-pick{display:flex; gap:4px; margin-bottom:8px;}
  .star-pick span{cursor:pointer; font-size:20px; color:var(--border);}
  .star-pick span.on{color:var(--cyan);}
  .submit-btn{
    background:none; border:1px solid var(--cyan); color:var(--cyan);
    padding:9px 16px; border-radius:var(--radius); font-family:'JetBrains Mono'; font-size:12px; cursor:pointer;
  }
  .submit-btn:hover{background:var(--cyan-dim);}
  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:20px;}

  .admin-head{
    font-family:var(--heading-font); font-size:20px; font-weight:700; margin-bottom:4px;
    text-shadow:0 0 12px var(--cyan-glow);
  }
  .admin-sub{color:var(--text-dim); font-size:12px; margin-bottom:20px;}
  .admin-form label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-dim); margin:14px 0 6px;
  }
  .admin-form input, .admin-form select, .admin-form textarea{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text); padding:11px; font-family:'Inter'; font-size:14px; outline:none;
  }
  .admin-form input:focus, .admin-form select:focus, .admin-form textarea:focus{border-color:var(--cyan);}
  .admin-row{display:flex; gap:10px;}
  .admin-row > div{flex:1;}
  .publish-btn{
    display:block; width:100%; background:var(--cyan); color:#04191A; font-weight:600;
    border:none; border-radius:var(--radius); padding:13px; font-family:var(--heading-font); font-size:14px;
    cursor:pointer; margin-top:20px; box-shadow:0 0 20px var(--cyan-glow);
  }
  /* Profile button */
  .profile-wrap{position:relative; cursor:pointer;}
  .profile-btn{
    width:36px; height:36px; border:1px solid var(--border); border-radius:50%;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-size:15px; color:var(--text-dim); background:var(--surface);
    transition:border-color .15s, color .15s;
  }
  .profile-btn img{width:100%; height:100%; object-fit:cover;}
  .profile-wrap:hover .profile-btn{border-color:var(--cyan); color:var(--cyan);}

  /* Settings */
  .opt-row{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 18px;}
  .opt-btn{
    padding:9px 14px; border:1px solid var(--border); border-radius:var(--radius);
    font-size:13px; color:var(--text-dim); cursor:pointer; transition:all .15s;
  }
  .opt-btn.active, .opt-btn:hover{color:var(--bg); background:var(--cyan); border-color:var(--cyan);}
  .avatar-lg{
    width:72px; height:72px; border-radius:50%; overflow:hidden;
    background:var(--surface); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:28px; margin-bottom:10px;
  }
  .avatar-lg img{width:100%; height:100%; object-fit:cover;}
  .dev-badge{
    display:inline-block; font-size:11px; color:var(--cyan); border:1px solid var(--cyan);
    border-radius:4px; padding:3px 8px; margin-top:6px; font-family:'JetBrains Mono';
  }

  /* Gate: CAPTCHA + inscription au démarrage */
  .gate{
    position:fixed; inset:0; z-index:200; background:var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
  }
  .gate.hidden{display:none;}
  .gate-box{width:100%; max-width:380px;}
  .captcha-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:18px 0;
  }
  .captcha-cell{
    aspect-ratio:1; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .captcha-cell.picked{border-color:var(--cyan); background:var(--cyan-dim);}
  .gate-error{color:#FF3B5C; font-size:12px; margin-top:8px; min-height:16px;}

  .acc-sheet{
    display:none; position:fixed; inset:0; z-index:400;
    background:rgba(5,5,7,0.7);
  }
  .acc-sheet.open{display:flex; align-items:flex-start; justify-content:center;}
  .acc-sheet-inner{
    margin-top:60px; width:min(360px, calc(100vw - 32px));
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; position:relative; max-height:80vh; overflow-y:auto;
  }
  .acc-sheet-close{
    position:absolute; top:14px; right:14px; cursor:pointer; color:var(--text-dim); font-size:16px;
  }
  .acc-head-email{font-size:13px; color:var(--text-dim); word-break:break-all; padding-right:24px;}
  .acc-head-avatar{
    width:56px; height:56px; border-radius:50%; margin:14px auto 8px;
    display:flex; align-items:center; justify-content:center;
    background:var(--cyan-dim); color:var(--cyan); font-size:22px; font-weight:700; overflow:hidden;
  }
  .acc-head-avatar img{width:100%; height:100%; object-fit:cover;}
  .acc-head-name{text-align:center; font-weight:600; margin-bottom:16px;}
  .acc-item{
    padding:14px 4px; border-top:1px solid var(--border); cursor:pointer; font-size:14px;

const SUPABASE_URL = 'https://scfuycacetqsgvccyfmp.supabase.co';

const Store = {
  async get(key, shared){
    if(!shared){
      const v = localStorage.getItem('nps_local_'+key);
      return v != null ? {key, value:v, shared} : null;
    }
    try{
      const res = await fetch(`${WORKER_URL}/kv/get?key=${encodeURIComponent(key)}`);
      if(!res.ok) return null;
      const data = await res.json();
      return data.value != null ? {key, value:data.value, shared} : null;
    }catch(e){ return null; }
  },
  async set(key, value, shared){
    if(!shared){
      localStorage.setItem('nps_local_'+key, value);
      return {key, value, shared};
    }
    const res = await fetch(`${WORKER_URL}/kv/set`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key, value})
    });
    if(!res.ok) throw new Error('set failed');
    return {key, value, shared};
  },
  async delete(key, shared){
    if(!shared){
      const existed = localStorage.getItem('nps_local_'+key) != null;
      localStorage.removeItem('nps_local_'+key);
      return {key, deleted:existed, shared};
    }
    const res = await fetch(`${WORKER_URL}/kv/delete`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key})
    });
    if(!res.ok) throw new Error('delete failed');
    return {key, deleted:true, shared};
  },
  async list(prefix, shared){
    if(!shared){
      const keys = [];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k.startsWith('nps_local_'+(prefix||''))) keys.push(k.replace('nps_local_',''));
      }
      return {keys, prefix, shared};
    }
    try{
      const res = await fetch(`${WORKER_URL}/kv/list?prefix=${encodeURIComponent(prefix||'')}`);
      if(!res.ok) return {keys:[], prefix, shared};
      const data = await res.json();
      return {keys:data.keys||[], prefix, shared};
    }catch(e){ return {keys:[], prefix, shared}; }
  }
};

async function loadNotifications(){
  try{
    const result = await Store.list("notif:", true);
    const keys = (result && result.keys) || [];
    const items = [];
    for(const k of keys){
      try{
        const r = await Store.get(k, true);
        if(r) items.push({...JSON.parse(r.value), _key: k});
      }catch(e){}
    }
    items.sort((a,b)=> new Date(b.time) - new Date(a.time));
    notifications = items.map(n => ({...n, time: timeAgo(n.time)}));
  }catch(e){
    notifications = [];
  }
}

function timeAgo(iso){
  const diff = Math.max(0, Date.now() - new Date(iso).getTime());
  const mins = Math.floor(diff/60000);
  if(mins < 1) return "À l'instant";
  if(mins < 60) return `Il y a ${mins} min`;
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return `Il y a ${hrs}h`;
  return `Il y a ${Math.floor(hrs/24)}j`;
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

(function setupLightboxSwipe(){

        <div class="rating"><span class="stars">${stars(a.rating)}</span> ${a.rating} · ${a.reviews.length} avis</div>
      </div>
    </div>

    <div class="meta-row">
      <div>Version<br><b>${a.version}</b></div>
      <div>Taille<br><b>${a.size}</b></div>
      <div>Téléchargements<br><b>${a.downloads}</b></div>
    </div>

    <a href="${a.apkUrl}" class="dl-btn" download>⬇ Télécharger l'APK</a>

    <div class="section-title">Captures d'écran</div>
    <div class="shots">
      ${(a.screenshots && a.screenshots.length)
        ? a.screenshots.map((s,i) => `<div class="has-img" onclick="openLightbox(${i})"><img src="${s}" style="width:100%;height:100%;object-fit:contain;border-radius:var(--radius);"></div>`).join('')
        : '<div>Aucune capture</div>'}
    </div>

    <div class="section-title">À propos de l'appli</div>
    <div class="desc clamped" id="descText">${a.desc}</div>
    <div class="desc-toggle" id="descToggle" onclick="toggleDesc()">Lire la suite</div>

    <div class="section-title">Avis et notes</div>
    <div class="rating-summary">
      <div>
        <div class="big">${a.rating}</div>
        <div class="stars-row">${stars(a.rating)}</div>
        <div class="count">${total} avis</div>
      </div>
      <div class="rating-bars">
        ${[5,4,3,2,1].map((n,i)=>`
          <div class="bar-row">
            <span>${n}</span>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(counts[i]/maxCount*100)}%"></div></div>
          </div>
        `).join('')}
      </div>
    </div>

    <div id="reviewList">
      ${a.reviews.length ? a.reviews.map((r,i) => `
        <div class="review">
          <div class="top"><span class="name">${r.name}</span><span class="stars">${stars(r.stars)}</span></div>
          <div class="date">${r.date || ''}</div>
          <p>${r.text}</p>
          <div class="helpful">
            Cet avis t'a aidé ?
            <button class="${r.helpful==='yes'?'on':''}" onclick="markHelpful(${i},'yes')">Oui</button>
            <button class="${r.helpful==='no'?'on':''}" onclick="markHelpful(${i},'no')">Non</button>
          </div>
        </div>
      `).join('') : '<div class="empty">Aucun avis pour le moment. Sois le premier à donner ton avis.</div>'}
    </div>

    <div class="review-form">
      <input id="rvName" type="text" placeholder="Ton nom">
      <div class="star-pick" id="starPick">
        ${[1,2,3,4,5].map(n=>`<span data-n="${n}" onclick="pickStar(${n})">★</span>`).join('')}
      </div>
      <textarea id="rvText" rows="3" placeholder="Ton avis sur cette app..."></textarea>
      <button class="submit-btn" onclick="submitReview()">Publier l'avis</button>
    </div>
  `;
  pickedStars = 0;
  setupDescToggle();
}

function setupDescToggle(){
  const el = document.getElementById('descText');
  const toggle = document.getElementById('descToggle');
  if(!el || !toggle) return;
  // Si le texte ne dépasse pas 4 lignes, pas besoin du bouton
  requestAnimationFrame(()=>{
    if(el.scrollHeight <= el.clientHeight + 4){
      toggle.style.display = 'none';
    }
  });
}
function toggleDesc(){
  const el = document.getElementById('descText');
  const toggle = document.getElementById('descToggle');
  const isClamped = el.classList.toggle('clamped');
  toggle.textContent = isClamped ? 'Lire la suite' : 'Réduire';
}

function markHelpful(i, value){
  const r = currentApp.reviews[i];
  if(!r) return;
  r.helpful = (r.helpful === value) ? null : value;
  renderDetail();
}

let pickedStars = 0;
function pickStar(n){
  pickedStars = n;
  document.querySelectorAll('#starPick span').forEach((el,i)=>{
    el.classList.toggle('on', i < n);
  });
}

function submitReview(){
  const name = document.getElementById('rvName').value.trim() || "Anonyme";
  const text = document.getElementById('rvText').value.trim();
  if(!text || pickedStars===0){
    alert("Ajoute une note et un commentaire avant de publier.");
    return;
  }
  const date = new Date().toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
  currentApp.reviews.unshift({name, stars:pickedStars, text, date, helpful:null});
  const total = currentApp.reviews.reduce((s,r)=>s+r.stars,0);
  currentApp.rating = Math.round((total/currentApp.reviews.length)*10)/10;
  renderDetail();
}

/* ===== Thème & langue ===== */
let userSettings = {theme:'circuit', lang:'fr'};
let userProfile = null;
const THEME_CLASSES = ['theme-synth','theme-matrix','theme-holo'];

function applyTheme(theme){
  document.body.classList.remove(...THEME_CLASSES);
  if(theme !== 'circuit') document.body.classList.add('theme-'+theme);
}

async function loadSettings(){
  try{
    const r = await Store.get('settings', false);
    if(r) userSettings = {...userSettings, ...JSON.parse(r.value)};
  }catch(e){}
  userSettings.theme = 'circuit'; // seul thème disponible désormais
  applyTheme(userSettings.theme);
  currentLang = userSettings.lang;
}
async function saveSettings(){
  try{ await Store.set('settings', JSON.stringify(userSettings), false); }catch(e){}
}
async function loadProfile(){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session){ userProfile = null; return; }
    const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
    if(error || !data){ userProfile = null; return; }
    userProfile = {
      id: data.id, username: data.username, email: session.user.email,
      isDeveloper: data.is_developer === 'true' ? true : (data.is_developer === 'pending' ? 'pending' : false),
      avatar: data.avatar, verified: true
    };
  }catch(e){ userProfile = null; }
}
async function saveProfile(){
  if(!userProfile || !userProfile.id) return;
  try{
    const { error } = await sb.from('profiles').update({
      username: userProfile.username,
      is_developer: String(userProfile.isDeveloper),
      avatar: userProfile.avatar
    }).eq('id', userProfile.id);
    if(error){
      const box = document.getElementById('debugError');
      if(box){ box.style.display='block'; box.textContent += 'Erreur sauvegarde profil: '+error.message+'\n'; }
    }
  }catch(e){}
}
function applyUILabels(){
  const s = document.getElementById('search');
  if(s) s.placeholder = t('search');
}
function renderProfileBtn(){
  const btn = document.getElementById('profileBtn');
  if(!btn) return;
  btn.innerHTML = (userProfile && userProfile.avatar) ? `<img src="${userProfile.avatar}">` : '👤';
}

/* ===== Authentification (gate) ===== */
function showGate(){ document.getElementById('gateOverlay').classList.remove('hidden'); }
function hideGate(){ document.getElementById('gateOverlay').classList.add('hidden'); }

function hideSplash(){
  const splash = document.getElementById('splashScreen');
  if(!splash) return;
  splash.classList.add('fade-out');
  setTimeout(()=> splash.classList.add('hidden'), 400);
}

/* ===== Authentification réelle (Supabase) : connexion / inscription ===== */
let authMode = 'login'; // 'login' | 'signup'

function showAuthGate(mode){
  authMode = mode || 'login';
  renderAuthGate();
}

function togglePasswordVisibility(){
  const input = document.getElementById('authPassword');
  const icon = document.getElementById('pwToggleIcon');
  if(!input) return;
  if(input.type === 'password'){
    input.type = 'text';
    icon.textContent = '🙈';
  } else {
    input.type = 'password';
    icon.textContent = '👁';
  }
}

function renderAuthGate(){
  const isSignup = authMode === 'signup';
  document.getElementById('gateBox').innerHTML = `
    <div class="admin-head">${isSignup ? t('signupTitle') : t('loginTitle')}</div>
    <div class="admin-sub">${isSignup ? t('signupSub') : t('loginSub')}</div>
    <div class="admin-form">
      ${isSignup ? `<label>${t('usernameLabel')}</label><input id="authUsername" placeholder="ex: NPS.NELSON">` : ''}
      <label>${t('emailLabel')}</label>
      <input id="authEmail" type="email" placeholder="ex: nom@email.com">
      <label>${t('passwordLabel')}</label>
      <div style="position:relative;">
        <input id="authPassword" type="password" placeholder="••••••••" style="padding-right:44px;">
        <span onclick="togglePasswordVisibility()" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px;" id="pwToggleIcon">👁</span>
      </div>
      <button class="publish-btn" id="authBtn" onclick="submitAuth()">${isSignup ? t('signupBtn') : t('loginBtn')}</button>
    </div>
    <div class="gate-error" id="gateError"></div>
    <div class="admin-sub" style="margin-top:14px; cursor:pointer;" onclick="showAuthGate('${isSignup ? 'login' : 'signup'}')">
      ${isSignup ? t('haveAccount') : t('noAccount')} <span style="color:var(--cyan);">${isSignup ? t('switchToLogin') : t('switchToSignup')}</span>
    </div>
  `;
}

async function submitAuth(){
  const isSignup = authMode === 'signup';
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const username = isSignup ? document.getElementById('authUsername').value.trim() : null;
  const err = document.getElementById('gateError');
  err.textContent = '';

  if(!email || !password || (isSignup && !username)){
    err.textContent = t('requiredFields');
    return;
  }

  const btn = document.getElementById('authBtn');
  btn.disabled = true; btn.textContent = '...';

  if(isSignup){
    const { data: existing } = await sb.from('profiles').select('id').eq('username', username).maybeSingle();
    if(existing){
      btn.disabled = false; btn.textContent = t('signupBtn');
      err.textContent = t('usernameTaken');
      return;
    }
    const { data, error } = await sb.auth.signUp({ email, password });
    if(error || !data.user){
      btn.disabled = false; btn.textContent = t('signupBtn');
      err.textContent = error ? error.message : t('authError');
      return;
    }
    await sb.from('profiles').insert({
      id: data.user.id, username, is_developer: 'false', avatar: null
    });
    await loadProfile();
    renderProfileBtn();
    hideGate();
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){
      btn.disabled = false; btn.textContent = t('loginBtn');
      err.textContent = t('authError');
      return;
    }
    await loadProfile();
    renderProfileBtn();
    hideGate();
  }
}

async function logout(){
  await sb.auth.signOut();
  userProfile = null;
  renderProfileBtn();
  closeSettings();
  showAuthGate('login');
  showGate();
}


/* ===== Paramètres ===== */
function openAccountSheet(){
  const head = document.getElementById('accSheetHead');
  const logoutItem = document.getElementById('accLogoutItem');
  if(userProfile){
    head.innerHTML = `
      <div class="acc-head-avatar">${userProfile.avatar ? `<img src="${userProfile.avatar}">` : '👤'}</div>
      <div class="acc-head-name">${userProfile.username}</div>
      <div class="acc-head-email" style="text-align:center;">${userProfile.email || ''}</div>
    `;
    logoutItem.style.display = 'block';
  } else {
    head.innerHTML = `
      <div class="acc-head-avatar">👤</div>
      <div class="acc-head-name">Non connecté</div>
    `;
    logoutItem.style.display = 'none';
  }
  document.getElementById('accSheet').classList.add('open');
}
function closeAccountSheet(ev){
  if(ev) ev.stopPropagation();
  document.getElementById('accSheet').classList.remove('open');
}

function openSettings(){
  document.getElementById('mainView').classList.add('hidden');
  document.getElementById('settingsView').classList.add('open');
  renderSettings();
}
function closeSettings(){
  document.getElementById('mainView').classList.remove('hidden');
  document.getElementById('settingsView').classList.remove('open');
}

let showAbout = false;

function renderSettings(){
  const stBack = document.getElementById('stBack');
  if(stBack) stBack.textContent = t('back');
  const c = document.getElementById('settingsContent');

  const profileBlock = userProfile ? `
    <div class="avatar-lg">${userProfile.avatar ? `<img src="${userProfile.avatar}">` : '👤'}</div>
    <div style="font-weight:600;">${userProfile.username}</div>
    ${userProfile.isDeveloper === true ? `<div class="dev-badge">${t('devBadge')}</div>` : ''}
    ${userProfile.isDeveloper === 'pending' ? `<div class="dev-badge" style="color:var(--text-dim); border-color:var(--text-dim);">${t('devPending')}</div>` : ''}
  ` : '';

  c.innerHTML = `
    <div class="admin-head">${t('settingsTitle')}</div>
    <div class="section-title" style="margin-top:6px;">${t('profile')}</div>
    ${profileBlock}
    ${userProfile && userProfile.isDeveloper === true ? `
      <input id="avatarFile" type="file" accept="image/*" style="margin-top:8px;">
      <div style="font-size:11px; color:var(--text-dim); margin-top:4px;">${t('changePhoto')}</div>
    ` : ''}

    <div class="section-title">${t('language')}</div>
    <div class="opt-row">
      <div class="opt-btn ${userSettings.lang==='fr'?'active':''}" onclick="setLang('fr')">Français</div>
      <div class="opt-btn ${userSettings.lang==='en'?'active':''}" onclick="setLang('en')">English</div>
    </div>

    <div class="section-title">DEV STORE</div>
    ${(!userProfile || !userProfile.isDeveloper) ? `<button class="publish-btn" style="margin-bottom:10px;" onclick="openDevInfo()">${t('becomeDev')}</button>` : ''}
    <button class="submit-btn" style="width:100%; text-align:center; margin-top:4px;" onclick="toggleAbout()">${t('about')}</button>
    ${userProfile ? `<button class="submit-btn" style="width:100%; text-align:center; margin-top:8px;" onclick="logout()">${t('logout')}</button>` : ''}
    <div id="aboutWrap"></div>
  `;

  if(showAbout) renderAboutBlock();

  const avInput = document.getElementById('avatarFile');
  if(avInput){
    avInput.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;
      userProfile.avatar = await resizeImage(file, 240, 0.8);
      await saveProfile();
      renderSettings();
      renderProfileBtn();
    });
  }
}

function toggleAbout(){
  showAbout = !showAbout;
  renderSettings();
}
function renderAboutBlock(){
  const w = document.getElementById('aboutWrap');
  if(w) w.innerHTML = `<div class="review" style="margin-top:10px;">${t('aboutText')}</div>`;
}

function setTheme(theme){
  userSettings.theme = theme;
  applyTheme(theme);
  saveSettings();
  renderSettings();
}
function setLang(lang){
  userSettings.lang = lang;
  currentLang = lang;
  saveSettings();
  applyUILabels();
  categories();
  renderGrid();
  renderSettings();
}

/* ===== Devenir développeur : écran d'explication + contact par email ===== */
function openDevInfo(){
  document.getElementById('settingsView').classList.remove('open');
  document.getElementById('devInfoView').classList.add('open');
  renderDevInfo();
}
function closeDevInfo(){
  document.getElementById('devInfoView').classList.remove('open');
  document.getElementById('settingsView').classList.add('open');
}

function renderDevInfo(){
  document.getElementById('devInfoContent').innerHTML = `
    <div class="admin-head">${t('devInfoTitle')}</div>
    <div class="admin-sub">${t('devInfoSub')}</div>
    <div style="color:var(--text-dim); font-size:14px; line-height:1.7; margin-top:16px;">
      ${t('devInfoText')}
    </div>
    <button class="publish-btn" style="margin-top:26px;" onclick="requestDeveloperAccess()">
      ✉️ ${t('unlockBtn')}
    </button>
  `;
}

async function requestDeveloperAccess(){
  const username = userProfile ? userProfile.username : '';
  const email = userProfile ? userProfile.email : '';
  const subject = encodeURIComponent('Demande développeur — DEV Store');
  const body = encodeURIComponent(
    `Nom d'utilisateur : ${username}\nEmail : ${email}\n\nJe souhaite devenir développeur sur DEV Store.\nCe que je compte publier : `
  );
  window.location.href = `mailto:Nelsonpataule11@gmail.com?subject=${subject}&body=${body}`;
  if(userProfile && !userProfile.isDeveloper){
    userProfile.isDeveloper = 'pending';
    await saveProfile();
  }
}

document.getElementById('search').addEventListener('input', renderGrid);
categories();
renderGrid();
renderBrowseGrid();
renderNotifs();

const GATE_ENABLED = true; // exige une connexion/inscription réelle pour utiliser DEV Store

(async function init(){
  await loadSettings();
  applyUILabels();
  categories();
  await loadProfile();
  renderProfileBtn();

  const dataLoad = Promise.all([ loadPublishedApps(), loadNotifications() ]);
  const safetyTimeout = new Promise(resolve => setTimeout(resolve, 8000));
  await Promise.race([ dataLoad, safetyTimeout ]);

  categories();
  renderGrid();
  renderBrowseGrid();
  renderNotifs();
  if(GATE_ENABLED && !userProfile){
    showAuthGate('login');
    showGate();
  } else {
    hideGate();
  }
  hideSplash();
})();
</script>
