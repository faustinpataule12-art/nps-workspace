    ];
    const getTeam = id => teams.find(t => t.id === id);

    const SAVE_KEY = 'miniFootballCup_save_v1';
    let selectedNewTeamId = 'bar'; // choix en cours dans l'écran de sélection
    let state = null;              // état du tournoi en cours
    let currentMatchRef = null;    // { round, index, playerIsTeam1 }

    let selectedTeamIndex = 0; // index dans teams[] de l'équipe du joueur pour le match affiché
    let aiTeamIndex = 1;

    let gameSettings = { ballBaseSpeed: 1.5, aiSpeed: 2.5, soundOn: true };

    /* ============================================================
       SON (généré, aucun fichier externe nécessaire)
    ============================================================ */
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) {
            try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
        }
    }
    function playTone(freq, duration, type, vol, delay) {
        if (!gameSettings.soundOn || !audioCtx) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(vol || 0.15, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + duration);
    }
    function playWhistle() { playTone(2100, 0.16, 'square', 0.13, 0); playTone(1700, 0.16, 'square', 0.1, 0.06); }
    function playGoalSound() { [523, 659, 784, 1046].forEach((f, i) => playTone(f, 0.16, 'triangle', 0.16, i * 0.09)); }
    function playBounce() { playTone(220, 0.05, 'square', 0.04, 0); }
    function playKickoff() { playTone(700, 0.12, 'sine', 0.1, 0); }
    function playClick() { playTone(500, 0.05, 'sine', 0.06, 0); }

    /* ============================================================
       NAVIGATION ENTRE ÉCRANS
    ============================================================ */
    function hideAllScreens() {
        ['home-screen', 'start-screen', 'settings-screen', 'team-screen', 'bracket-screen'].forEach(id =>
            document.getElementById(id).classList.add('hidden'));
        document.getElementById('fieldCanvas').classList.add('hidden');
        document.getElementById('pause-btn').classList.add('hidden');
        document.getElementById('pause-overlay').classList.add('hidden');
    }
    function goToHome() {
        initAudio();
        matchRunning = false;
        hideAllScreens();
        document.getElementById('home-screen').classList.remove('hidden');
    }
    function goToStartScreen() {
        initAudio(); playClick();
        hideAllScreens();
        document.getElementById('start-screen').classList.remove('hidden');
        const saved = localStorage.getItem(SAVE_KEY);
        const continueBtn = document.getElementById('continue-btn');
        continueBtn.classList.toggle('hidden', !saved);
        if (saved) {
            try {
                const savedState = JSON.parse(saved);
                const playerT = teams.find(t => t.id === savedState.playerTeamId);
                if (savedState.tournamentComplete) {
                    continueBtn.textContent = '▶ VOIR LE RÉSULTAT';
                } else {
                    const r = savedState.currentRound;
                    const m = savedState.bracket[r].find(mm => !mm.played && (mm.team1Id === savedState.playerTeamId || mm.team2Id === savedState.playerTeamId));
                    if (m) {
                        const oppId = m.team1Id === savedState.playerTeamId ? m.team2Id : m.team1Id;
                        const oppT = teams.find(t => t.id === oppId);
                        continueBtn.textContent = `▶ CONTINUER : ${playerT ? playerT.name : '?'} vs ${oppT ? oppT.name : '?'}`;
                    } else {
                        continueBtn.textContent = '▶ CONTINUER';
                    }
                }
            } catch (e) { continueBtn.textContent = '▶ CONTINUER'; }
        }
    }
    function goToSettings() { hideAllScreens(); document.getElementById('settings-screen').classList.remove('hidden'); }
    function goToTeamSelect() { hideAllScreens(); document.getElementById('team-screen').classList.remove('hidden'); renderTeamsGrid(); }
    function goToBracketScreen() { hideAllScreens(); document.getElementById('bracket-screen').classList.remove('hidden'); renderBracketScreen(); }

    function onContinuePressed() {
        initAudio(); playClick();
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) { goToHome(); return; }
        state = JSON.parse(raw);
        goToBracketScreen();
    }
    function onNewTournamentPressed() { initAudio(); playClick(); goToTeamSelect(); }

    /* ============================================================
       SÉLECTION D'ÉQUIPE
    ============================================================ */
    function renderTeamsGrid() {
        const grid = document.getElementById('teamsGrid');
        grid.innerHTML = '';
        teams.forEach((team) => {
            const card = document.createElement('div');
            card.className = `team-card ${team.id === selectedNewTeamId ? 'selected' : ''}`;
            card.innerHTML = `<span style="font-size:9px; background:rgba(0,0,0,0.6); color:#fff; width:100%; padding:2px; position:absolute; bottom:0;">${team.name}</span>`;
            const miniCanvas = document.createElement('canvas');
            miniCanvas.width = 50; miniCanvas.height = 40;
            drawCustomBadge(miniCanvas.getContext('2d'), 25, 20, 18, team.type);
            card.prepend(miniCanvas);
            card.onclick = () => { initAudio(); playClick(); selectedNewTeamId = team.id; renderTeamsGrid(); };
            grid.appendChild(card);
        });
    }

    function onSharePressed() {
        initAudio(); playClick();

        // Exemple futur : if (navigator.share) navigator.share({ title: 'Mini Football Cup', url: 'LIEN_A_AJOUTER' });
    }
    function updateSettings() {
        gameSettings.ballBaseSpeed = parseFloat(document.getElementById('ballSpeedRange').value);
        gameSettings.aiSpeed = parseFloat(document.getElementById('aiSpeedRange').value);
        gameSettings.soundOn = document.getElementById('soundRange').value === '1';
        aiTeam.speed = gameSettings.aiSpeed;
        document.getElementById('sound-label').textContent = '🔊 Son : ' + (gameSettings.soundOn ? 'Activé' : 'Coupé');
    }

    /* ============================================================
       LOGIQUE DU TOURNOI (bracket à élimination directe, 16 équipes)
    ============================================================ */
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    function emptyMatch() { return { team1Id: null, team2Id: null, score1: 0, score2: 0, played: false, winnerId: null }; }
    function createSkeletonBracket() {
        return [
            Array.from({ length: 8 }, emptyMatch),
            Array.from({ length: 4 }, emptyMatch),
            Array.from({ length: 2 }, emptyMatch),
            Array.from({ length: 1 }, emptyMatch)
        ];
    }
    function confirmTeamAndCreateTournament() {
        initAudio(); playClick();
        const ids = shuffle(teams.map(t => t.id));
        const bracket = createSkeletonBracket();
        for (let i = 0; i < 8; i++) {
            bracket[0][i].team1Id = ids[i * 2];
            bracket[0][i].team2Id = ids[i * 2 + 1];
        }
        state = {
            playerTeamId: selectedNewTeamId,
            bracket: bracket,
            currentRound: 0,
            tournamentComplete: false,
            playerEliminated: false,
            eliminatedRoundName: null,
            championId: null
        };
        saveGame();
        goToBracketScreen();
    }
    function saveGame() {
        if (state) localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }
    function clearSave() { localStorage.removeItem(SAVE_KEY); }

    function simulateMatch(m) {
        if (m.played || !m.team1Id || !m.team2Id) return;
        let s1 = Math.floor(Math.random() * 4);
        let s2 = Math.floor(Math.random() * 4);
        if (s1 === s2) { if (Math.random() < 0.5) s1++; else s2++; }
        m.score1 = s1; m.score2 = s2; m.played = true;
        m.winnerId = s1 > s2 ? m.team1Id : m.team2Id;
    }
    function fillNextRound(roundIndex) {
        const prev = state.bracket[roundIndex - 1];
        const round = state.bracket[roundIndex];
        for (let i = 0; i < round.length; i++) {
            round[i].team1Id = prev[i * 2].winnerId;
            round[i].team2Id = prev[i * 2 + 1].winnerId;
        }
    }
    const ROUND_NAMES = ['Seizièmes de finale', 'Quarts de finale', 'Demi-finales', 'Finale'];

    function advanceIfRoundComplete(roundIndex) {
        const round = state.bracket[roundIndex];
        if (!round.every(m => m.played)) return;
        if (roundIndex + 1 < state.bracket.length) {
            fillNextRound(roundIndex + 1);
            state.currentRound = roundIndex + 1;
        } else {
            state.tournamentComplete = true;
            state.championId = round[0].winnerId;
        }
    }
    function autoResolveRemaining() {
        let guard = 0;
        while (!state.tournamentComplete && guard < 20) {
            guard++;
            const r = state.currentRound;
            state.bracket[r].forEach(m => simulateMatch(m));
            advanceIfRoundComplete(r);
        }
    }

    function onBracketAction() {
        initAudio(); playClick();
        if (state.tournamentComplete) {
            clearSave();
            goToTeamSelect();
            return;
        }
        const r = state.currentRound;
        // Simule les autres rencontres du tour (celles qui n'impliquent pas le joueur)
        state.bracket[r].forEach(m => {
            if (!m.played && m.team1Id !== state.playerTeamId && m.team2Id !== state.playerTeamId) simulateMatch(m);
        });
        const pmIndex = state.bracket[r].findIndex(m => !m.played && (m.team1Id === state.playerTeamId || m.team2Id === state.playerTeamId));
        if (pmIndex >= 0) {
            const m = state.bracket[r][pmIndex];
            currentMatchRef = { round: r, index: pmIndex, playerIsTeam1: m.team1Id === state.playerTeamId };
            const opponentId = currentMatchRef.playerIsTeam1 ? m.team2Id : m.team1Id;
            launchMatch(state.playerTeamId, opponentId);
        } else {
            // Le joueur est déjà éliminé : on résout le reste automatiquement
            autoResolveRemaining();
            saveGame();
            renderBracketScreen();
        }
    }

    function recordMatchResult() {
        const { round, index, playerIsTeam1 } = currentMatchRef;
        const m = state.bracket[round][index];
        if (playerIsTeam1) { m.score1 = scoreTeam2; m.score2 = scoreTeam1; }
        else { m.score1 = scoreTeam1; m.score2 = scoreTeam2; }
        m.played = true;
        m.winnerId = m.score1 > m.score2 ? m.team1Id : m.team2Id;
        if (m.winnerId !== state.playerTeamId) {
            state.playerEliminated = true;
            state.eliminatedRoundName = ROUND_NAMES[round];
        }
        advanceIfRoundComplete(round);
        if (state.playerEliminated && !state.tournamentComplete) autoResolveRemaining();
        saveGame();
    }

    /* ============================================================
       AFFICHAGE DU TABLEAU
    ============================================================ */
    function renderBracketScreen() {
        const container = document.getElementById('bracketContainer');
        container.innerHTML = '';
        state.bracket.forEach((round, ri) => {
            const col = document.createElement('div');
            col.className = 'bracket-round';
            const h = document.createElement('div');
            h.className = 'round-title';
            h.textContent = ROUND_NAMES[ri];
            col.appendChild(h);
            round.forEach(m => col.appendChild(renderMatchRow(m)));
            container.appendChild(col);
        });

        const statusEl = document.getElementById('bracketStatus');
        const actionBtn = document.getElementById('bracketActionBtn');
        if (state.tournamentComplete) {
            const champ = getTeam(state.championId);
            statusEl.textContent = state.playerEliminated
                ? `Tournoi terminé — Champion : ${champ.name} (toi : ${state.eliminatedRoundName})`
                : `🏆 CHAMPION : ${champ.name} — C'EST TOI !`;
            actionBtn.textContent = 'NOUVEAU TOURNOI';
        } else if (state.playerEliminated) {
            statusEl.textContent = `Éliminé(e) en ${state.eliminatedRoundName} — le tournoi continue...`;
            actionBtn.textContent = 'VOIR LA SUITE';
        } else {
            statusEl.textContent = '';
            actionBtn.textContent = 'JOUER MON MATCH';
        }
    }
    function renderMatchRow(m) {
        const row = document.createElement('div');
        row.className = 'match-row';
        row.appendChild(renderTeamSlot(m.team1Id, m.score1, m.played, m.winnerId));
        row.appendChild(renderTeamSlot(m.team2Id, m.score2, m.played, m.winnerId));
        return row;
    }
    function renderTeamSlot(teamId, score, played, winnerId) {
        const div = document.createElement('div');
        div.className = 'team-slot';
        if (teamId === state.playerTeamId) div.classList.add('is-player');
        if (played && winnerId && teamId && teamId !== winnerId) div.classList.add('eliminated');
        if (teamId) {
            const t = getTeam(teamId);
            const c = document.createElement('canvas');
            c.width = 22; c.height = 22;
            drawCustomBadge(c.getContext('2d'), 11, 11, 10, t.type);
            div.appendChild(c);
            const name = document.createElement('span');
            name.textContent = t.name;
            div.appendChild(name);
        } else {
            const span = document.createElement('span');
            span.textContent = '?';
            div.appendChild(span);
        }
        if (played) {
            const b = document.createElement('b');
            b.textContent = score;
            div.appendChild(b);
        }
        return div;
    }

    function drawField() {
        const stripeHeight = 40;
        ctx.fillStyle = '#228B22';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < canvas.height; y += stripeHeight * 2) {
            ctx.fillStyle = '#1e7b1e';
            ctx.fillRect(0, y, canvas.width, stripeHeight);
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.lineWidth = 3;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
        ctx.beginPath();
        ctx.moveTo(20, canvas.height / 2);
        ctx.lineTo(canvas.width - 20, canvas.height / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeRect(canvas.width / 2 - 90, 20, 180, 100);
        ctx.strokeRect(canvas.width / 2 - 40, 20, 80, 40);
        ctx.strokeRect(canvas.width / 2 - 90, canvas.height - 120, 180, 100);
        ctx.strokeRect(canvas.width / 2 - 40, canvas.height - 60, 80, 40);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(canvas.width / 2 - 50, 5, 100, 15);
        ctx.fillRect(canvas.width / 2 - 50, canvas.height - 20, 100, 15);
    }

    // Ballon réaliste avec motif pentagones/hexagones
    function drawBall(x, y, r) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = '#222';
        ctx.stroke();

        function pentagon(cx, cy, size, rot) {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const ang = rot + i * (Math.PI * 2 / 5) - Math.PI / 2;
                const px = cx + Math.cos(ang) * size;
                const py = cy + Math.sin(ang) * size;
                if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = '#111';
            ctx.fill();
        }
        // pentagone central
        pentagon(x, y, r * 0.4, 0);
        // pentagones satellites
        for (let i = 0; i < 5; i++) {
            const ang = i * (Math.PI * 2 / 5) - Math.PI / 2;
            const sx = x + Math.cos(ang) * r * 0.72;
            const sy = y + Math.sin(ang) * r * 0.72;
            pentagon(sx, sy, r * 0.26, ang);
        }
        ctx.restore();
    }

    function drawUI() {

        ctx.font = 'bold 36px "Courier New"';

    function update() {
        if (!matchRunning) return;
        if (goalAnimationTimer > 0) {
            goalAnimationTimer--;
            if (goalAnimationTimer === 0 && pendingEndMatch) { pendingEndMatch = false; endMatch(); }
            return;
        }

        if (ball.y < canvas.height / 2) {
            if (aiTeam.x < ball.x) aiTeam.x += aiTeam.speed;
            if (aiTeam.x > ball.x) aiTeam.x -= aiTeam.speed;
            if (aiTeam.y < ball.y) aiTeam.y += aiTeam.speed;
            if (aiTeam.y > ball.y) aiTeam.y -= aiTeam.speed;
        } else {
            if (aiTeam.x < canvas.width / 2) aiTeam.x += aiTeam.speed * 0.5;
            if (aiTeam.x > canvas.width / 2) aiTeam.x -= aiTeam.speed * 0.5;
            if (aiTeam.y > 180) aiTeam.y -= aiTeam.speed * 0.5;
        }

        ball.x += ball.vx * gameSettings.ballBaseSpeed;
        ball.y += ball.vy * gameSettings.ballBaseSpeed;
        ball.vx *= ball.speedDecay;
        ball.vy *= ball.speedDecay;
        if (Math.abs(ball.vx) < 0.8) ball.vx = ball.vx >= 0 ? 1.2 : -1.2;
        if (Math.abs(ball.vy) < 0.8) ball.vy = ball.vy >= 0 ? 1.5 : -1.5;

        if (ball.x - ball.radius < 20) { ball.x = 20 + ball.radius; ball.vx *= -1; }
        if (ball.x + ball.radius > canvas.width - 20) { ball.x = canvas.width - 20 - ball.radius; ball.vx *= -1; }

        if (ball.y < 25) {
            if (ball.x > canvas.width / 2 - 50 && ball.x < canvas.width / 2 + 50) {
                scoreTeam2++;
                playGoalSound();
                if (overtime) pendingEndMatch = true;
                triggerConfetti();
                resetBall();
                return;
            } else { ball.y = 25; ball.vy *= -1; }
        }
        if (ball.y > canvas.height - 25) {
            if (ball.x > canvas.width / 2 - 50 && ball.x < canvas.width / 2 + 50) {
                scoreTeam1++;
                playGoalSound();
                if (overtime) pendingEndMatch = true;
                triggerConfetti();
                resetBall();
                return;
            } else { ball.y = canvas.height - 25; ball.vy *= -1; }
        }

        checkCollision(aiTeam);
        checkCollision(playerTeam);
    }

    function checkCollision(entity) {
        const dx = ball.x - entity.x;
        const dy = ball.y - entity.y;
        const dist = Math.hypot(dx, dy);
        const minDist = ball.radius + entity.radius;
        if (dist < minDist) {
            const angle = Math.atan2(dy, dx);
            const hitSpeed = entity.isDragging ? 9 : 5;
            ball.vx = Math.cos(angle) * (hitSpeed + Math.abs(ball.vx) * 0.5);
            ball.vy = Math.sin(angle) * (hitSpeed + Math.abs(ball.vy) * 0.5);
            ball.x = entity.x + Math.cos(angle) * minDist;
            ball.y = entity.y + Math.sin(angle) * minDist;
            playBounce();
        }
    }

    function drawCelebration() {
        if (goalAnimationTimer > 0) {
            confetti.forEach(c => {
                c.x += c.vx; c.y += c.vy; c.rotation += c.vRot;

                ctx.translate(c.x, c.y);
                ctx.rotate(c.rotation * Math.PI / 180);
                ctx.fillStyle = c.color;
                ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
                ctx.restore();
            });
            ctx.save();
            ctx.font = 'bold 50px "Courier New"';
            ctx.textAlign = 'center';
            ctx.shadowColor = '#00ffcc';
            ctx.shadowBlur = 25;
            ctx.fillStyle = '#fffa65';
            ctx.fillText("BUT !", canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }
    }

    function drawCustomBadge(targetCtx, x, y, radius, type) {
        targetCtx.save();
        targetCtx.beginPath();
        targetCtx.arc(x, y, radius, 0, Math.PI * 2);
        targetCtx.closePath();
        targetCtx.clip();
        targetCtx.fillStyle = '#ffffff';
        targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);

        if (type === 'barca') {
            targetCtx.fillStyle = '#a50044';
            targetCtx.fillRect(x - radius, y - radius, radius * 0.7, radius * 2);
            targetCtx.fillStyle = '#004d98';
            targetCtx.fillRect(x - radius * 0.3, y - radius, radius * 0.7, radius * 2);

            targetCtx.fillRect(x - radius * 0.1, y - radius * 0.5, radius * 0.2, radius);

            targetCtx.fillStyle = '#cb3524';
            targetCtx.fillRect(x - radius, y - radius, radius * 0.6, radius * 2);
            targetCtx.fillRect(x + radius * 0.2, y - radius, radius * 0.6, radius * 2);
            targetCtx.fillStyle = '#0b2b6b';
            targetCtx.fillRect(x - radius, y + radius * 0.7, radius * 2, radius * 0.3);
        } else if (type === 'bilbao') {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            const stripeW = radius * 2 / 7;
            for (let i = 0; i < 7; i += 2) {
                targetCtx.fillStyle = '#e2001a';
                targetCtx.fillRect(x - radius + i * stripeW, y - radius, stripeW, radius * 2);
            }
            badgeText(targetCtx, x, y, 'ATH', '#000', 8);
        } else if (type === 'valencia') {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#000000';
            targetCtx.beginPath();
            targetCtx.moveTo(x - radius, y - radius);
            targetCtx.lineTo(x - radius * 0.2, y - radius);
            targetCtx.lineTo(x + radius, y + radius * 0.4);
            targetCtx.lineTo(x + radius, y + radius);
            targetCtx.lineTo(x + radius * 0.2, y + radius);
            targetCtx.lineTo(x - radius, y - radius * 0.4);
            targetCtx.closePath();
            targetCtx.fill();
            targetCtx.fillStyle = '#f47b20';
            targetCtx.beginPath(); targetCtx.arc(x, y, radius * 0.28, 0, Math.PI * 2); targetCtx.fill();
        } else if (type === 'sevilla') {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#d81920';
            targetCtx.fillRect(x - radius, y, radius * 2, radius);
            targetCtx.fillStyle = '#e6b800';
            targetCtx.fillRect(x - radius, y - radius * 0.12, radius * 2, radius * 0.24);
        } else if (type === 'villarreal') {
            targetCtx.fillStyle = '#ffe500';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.strokeStyle = '#00529b';
            targetCtx.lineWidth = radius * 0.28;
            targetCtx.beginPath(); targetCtx.arc(x, y, radius * 0.68, 0, Math.PI * 2); targetCtx.stroke();
            badgeText(targetCtx, x, y, 'VIL', '#00529b', 9);
        } else if (type === 'sociedad') {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#0033a0';
            targetCtx.fillRect(x - radius, y - radius, radius * 0.55, radius * 2);
            targetCtx.fillRect(x - radius * 0.05, y - radius, radius * 0.55, radius * 2);
            badgeText(targetCtx, x, y, 'RSO', '#fff', 8);
        } else if (type === 'celta') {
            targetCtx.fillStyle = '#8ecbe6';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.strokeStyle = '#ffffff';
            targetCtx.lineWidth = 3;
            targetCtx.beginPath(); targetCtx.arc(x, y, radius * 0.6, 0, Math.PI * 2); targetCtx.stroke();
            badgeText(targetCtx, x, y, 'CEL', '#00305e', 9);
        } else if (type === 'getafe') {
            targetCtx.fillStyle = '#0b2a6b';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius * 0.15, radius * 2, radius * 0.3);
            badgeText(targetCtx, x, y, 'GET', '#fff', 8);
        } else if (type === 'almeria') {
            targetCtx.fillStyle = '#ffffff';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#d0102a';
            targetCtx.beginPath();
            targetCtx.moveTo(x - radius, y - radius);
            targetCtx.lineTo(x + radius, y - radius);
            targetCtx.lineTo(x - radius, y + radius);
            targetCtx.closePath();
            targetCtx.fill();
            badgeText(targetCtx, x, y, 'ALM', '#d0102a', 8);
        } else if (GENERIC_BADGES[type]) {
            const [c1, c2, abbr] = GENERIC_BADGES[type];
            targetCtx.fillStyle = c1;
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = c2;
            targetCtx.fillRect(x, y - radius, radius, radius * 2);
            badgeText(targetCtx, x, y, abbr, c1 === '#ffffff' ? '#000' : '#fff', 8);
        } else {
            targetCtx.fillStyle = '#ee2523';
            targetCtx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            targetCtx.fillStyle = '#ffffff';
            targetCtx.beginPath(); targetCtx.arc(x, y, radius * 0.6, 0, Math.PI * 2); targetCtx.fill();
        }
        targetCtx.restore();

        targetCtx.beginPath();
        targetCtx.arc(x, y, radius, 0, Math.PI * 2);
        targetCtx.strokeStyle = '#ffd700';
        targetCtx.lineWidth = 2.5;
        targetCtx.stroke();
    }

    /* ---------- Contrôles tactiles / souris ---------- */
    function getTouchPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }
    window.addEventListener('mousedown', (e) => {
        if (!matchRunning) return;
        const pos = getTouchPos(e);
        if (Math.hypot(pos.x - playerTeam.x, pos.y - playerTeam.y) < playerTeam.radius + 20) playerTeam.isDragging = true;
    });
    window.addEventListener('mousemove', (e) => {
        if (!playerTeam.isDragging || !matchRunning) return;
        const pos = getTouchPos(e);
        playerTeam.x = Math.max(35, Math.min(canvas.width - 35, pos.x));
        playerTeam.y = Math.max(canvas.height / 2 + 25, Math.min(canvas.height - 35, pos.y));
    });
    window.addEventListener('mouseup', () => { playerTeam.isDragging = false; });
    window.addEventListener('touchstart', (e) => {
        if (!matchRunning) return;
        const pos = getTouchPos(e);
        if (Math.hypot(pos.x - playerTeam.x, pos.y - playerTeam.y) < playerTeam.radius + 30) playerTeam.isDragging = true;
    });
    window.addEventListener('touchmove', (e) => {
        if (!playerTeam.isDragging || !matchRunning) return;
        const pos = getTouchPos(e);
        playerTeam.x = Math.max(35, Math.min(canvas.width - 35, pos.x));
        playerTeam.y = Math.max(canvas.height / 2 + 25, Math.min(canvas.height - 35, pos.y));
    });
    window.addEventListener('touchend', () => { playerTeam.isDragging = false; });

    function gameLoop() {
        update();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawField();
        drawUI();
        drawCustomBadge(ctx, aiTeam.x, aiTeam.y, aiTeam.radius, teams[aiTeamIndex].type);
        drawCustomBadge(ctx, playerTeam.x, playerTeam.y, playerTeam.radius, teams[selectedTeamIndex].type);
        drawBall(ball.x, ball.y, ball.radius);
        drawCelebration();
        requestAnimationFrame(gameLoop);
    }
    gameLoop();

    /* ============================================================
       DÉMARRAGE
    ============================================================ */
    goToHome();
</script>

</body>
</html>
