name: NPS Terminal
# nps-terminal-v6
run-name: NPS ${{ github.event.client_payload.request_id }}
on:
  repository_dispatch:
    types: [nps_exec]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authentification GitHub
        run: |
          NPS_TOKEN=$(jq -r '.client_payload.token // empty' "$GITHUB_EVENT_PATH")
          if [ -n "$NPS_TOKEN" ]; then
            echo "::add-mask::$NPS_TOKEN"
            echo "GH_TOKEN=$NPS_TOKEN" >> "$GITHUB_ENV"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global url."https://x-access-token:$NPS_TOKEN@github.com/".insteadOf "https://github.com/"
          fi

      - name: Exécuter la commande
        id: run_cmd
        continue-on-error: true
        env:
          NPS_COMMAND: ${{ github.event.client_payload.command }}
        run: |
          set +e
          echo "$NPS_COMMAND" > /tmp/nps_cmd.sh
          bash /tmp/nps_cmd.sh > /tmp/nps_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Écrire le résultat
        env:
          REQ_ID: ${{ github.event.client_payload.request_id }}
          EXIT_CODE: ${{ steps.run_cmd.outputs.exit_code }}
        run: |
          mkdir -p nps-terminal-results
          cat > /tmp/nps_write.js <<'NPSJS'
          const fs = require('fs');
          const cp = require('child_process');
          const NUL = String.fromCharCode(0);
          let output = '';
          try { output = fs.readFileSync('/tmp/nps_output.txt', 'utf8').slice(0, 50000); } catch (e) {}
          const createdFiles = [];
          try {
            const listing = cp.execSync('git -c core.quotepath=false ls-files -m -o --exclude-standard -z', { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 });
            for (const p of listing.split(NUL)) {
              if (!p) continue;
              const name = p.split('/').pop().toLowerCase();
              if (name === 'readme.md' || name.startsWith('.git') || p.startsWith('nps-terminal-results') || p.startsWith('node_modules/') || name.endsWith('.part') || name.endsWith('.ytdl') || name.endsWith('.tmp')) continue;
              try {
                const st = fs.statSync(p);
                if (st.isFile() && st.size > 0) createdFiles.push(p);
              } catch (e) {}
            }
          } catch (e) {}
          const code = process.env.EXIT_CODE === undefined || process.env.EXIT_CODE === '' ? 1 : Number(process.env.EXIT_CODE);
          const data = { success: code === 0, exit_code: code, output: output, createdFiles: createdFiles };
          fs.writeFileSync('nps-terminal-results/' + process.env.REQ_ID + '.json', JSON.stringify(data));
          NPSJS
          node /tmp/nps_write.js

      - name: Commit et push le résultat
        run: |
          git config user.name "NPS Terminal Bot"
          git config user.email "nps-bot@users.noreply.github.com"
          git add -A
          git commit -m "Exécution terminal NPS et fichiers: ${{ github.event.client_payload.request_id }}" || echo "Rien à committer"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
