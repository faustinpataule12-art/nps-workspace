name: NPS Terminal
on:
  repository_dispatch:
    types: [nps_exec]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Exécuter la commande
        id: run_cmd
        continue-on-error: true
        env:
          NPS_COMMAND: ${{ github.event.client_payload.command }}
        run: |
          echo "$NPS_COMMAND" > /tmp/nps_cmd.sh
          bash /tmp/nps_cmd.sh > /tmp/nps_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Écrire le résultat
        env:
          REQ_ID: ${{ github.event.client_payload.request_id }}
          EXIT_CODE: ${{ steps.run_cmd.outputs.exit_code }}
        run: |
          mkdir -p nps-terminal-results
          node -e "
            const fs=require('fs');
            const cp=require('child_process');
            const output=fs.readFileSync('/tmp/nps_output.txt','utf8').slice(0,50000);
            let createdFiles = [];
            try {
              const status = cp.execSync('git status --porcelain', { encoding: 'utf8' });
              const lines = status.split('
').filter(Boolean);
              for (const line of lines) {
                const p = line.slice(3).trim().replace(/^"|"$/g, '');
                if (!p) continue;
                const name = p.split('/').pop().toLowerCase();
                if (name === 'readme.md' || name.startsWith('.git') || name.startsWith('nps-terminal-results') || name === 'node_modules' || name.endsWith('.part') || name.endsWith('.ytdl') || name.endsWith('.tmp')) continue;
                try {
                  if (fs.existsSync(p) && fs.statSync(p).isFile() && fs.statSync(p).size > 0) {
                    createdFiles.push(p);
                  }
                } catch(e) {}
              }
            } catch(e) {}
            const data={success: process.env.EXIT_CODE==='0', exit_code: Number(process.env.EXIT_CODE||1), output, createdFiles};
            fs.writeFileSync('nps-terminal-results/' + process.env.REQ_ID + '.json', JSON.stringify(data));
          "

      - name: Commit et push le résultat
        run: |
          git config user.name "NPS Terminal Bot"
          git config user.email "nps-bot@users.noreply.github.com"
          git add -A
          git commit -m "Exécution terminal NPS et fichiers: ${{ github.event.client_payload.request_id }}" || echo "Rien à committer"
          git pull --rebase
          git push
